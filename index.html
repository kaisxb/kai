<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي لغتي الخارق ⚡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 2rem;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .progress-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 100%;
      transition: width 1s linear;
    }

    .question-box {
      margin-bottom: 1.8rem;
    }

    .question-category {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
    }

    .question-title {
      font-size: 1.4rem;
      line-height: 1.5;
      font-weight: 700;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .btn-opt {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 1rem 1.2rem;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      text-align: right;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-opt:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-opt.correct {
      background: rgba(34, 197, 94, 0.2) !important;
      border-color: var(--success) !important;
      color: #86efac;
    }

    .btn-opt.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--danger) !important;
      color: #fca5a5;
    }

    .explanation {
      margin-top: 1.2rem;
      padding: 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.05);
      display: none;
    }

    .btn-next {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      color: white;
      padding: 1rem;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 900;
      margin-top: 1.2rem;
      cursor: pointer;
      display: none;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
      transition: transform 0.2s ease;
    }

    .btn-next:hover {
      transform: scale(1.02);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-btn {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      color: white;
      padding: 1rem;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Start Screen -->
    <div id="startScreen" class="screen active" style="text-align: center;">
      <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">🔥  ريتال </h1>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">اختبر معلوماتك في الإعراب، الإملاء، وألغاز البلاغة قبل نفاد الوقت!</p>
      <div style="background: rgba(255,255,255,0.03); padding: 1.2rem; border-radius: 16px; margin-bottom: 1.5rem; text-align: right;">
        <p>⚡ <b>المؤقت:</b> 15 ثانية لكل سؤال</p>
        <p>🎯 <b>النقاط:</b> كل إجابة سريعة تعطيك نقاطاً أعلى</p>
        <p>🏆 <b>الهدف:</b> جمع أعلى رقم قياسي</p>
      </div>
      <button class="hero-btn" onclick="startQuiz()">انطلاق 🚀</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen">
      <div class="top-bar">
        <div class="stat-badge">⏱️ <span id="timerText">15</span>ث</div>
        <div class="stat-badge">⭐ النقاط: <span id="scoreText">0</span></div>
        <div class="stat-badge">السؤال <span id="qIndex">1</span>/5</div>
      </div>

      <div class="progress-track">
        <div id="timerBar" class="progress-fill"></div>
      </div>

      <div class="question-box">
        <div id="qCat" class="question-category">نحو وإعراب</div>
        <div id="qTitle" class="question-title">تحميل السؤال...</div>
      </div>

      <div id="optionsContainer" class="options-grid"></div>

      <div id="explainBox" class="explanation"></div>
      <button id="nextBtn" class="btn-next" onclick="nextQuestion()">التالي ➔</button>
    </div>

    <!-- Result Screen -->
    <div id="endScreen" class="screen" style="text-align: center;">
      <h2 style="font-size: 2rem; margin-bottom: 0.5rem;" id="endTitle">مبروك! 🎉</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">لقد أنهيت التحدي بنجاح</p>
      <div style="font-size: 3.5rem; font-weight: 900; color: var(--accent); margin-bottom: 1rem;" id="finalScore">0</div>
      <p id="endMessage" style="font-size: 1.1rem; margin-bottom: 2rem;"></p>
      <button class="hero-btn" onclick="restartQuiz()">إعادة التحدي 🔄</button>
    </div>
  </div>

  <script>
    // Audio FX using Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const playCorrect = () => { playTone(587.33, 'sine', 0.1); setTimeout(() => playTone(880, 'sine', 0.2), 100); };
    const playWrong = () => { playTone(220, 'triangle', 0.2); setTimeout(() => playTone(164.81, 'triangle', 0.3), 150); };

    // Questions Data
    const questions = [
      {
        cat: "إملاء وذكاء",
        q: "أيّ الكلمات التالية كُتبت فيها الهمزة بشكل صحيح؟",
        options: ["مسؤلية", "مسؤولية", "مسئولية", "مسؤالية"],
        ans: 1,
        exp: "تُكتب 'مسؤولية' بالهمزة على واو لأن الهمزة مضمومة وما قبلها ساكن، والضم أقوى من السكون."
      },
      {
        cat: "نحو وإعراب",
        q: "ما إعراب كلمة «أخوك» في: «إنّ أخاك ذو علمٍ»؟",
        options: ["اسم إنّ منصوب بالألف", "خبر إنّ مرفوع بالواو", "مبتدأ مرفوع بالضمة", "فاعل مرفوع بالواو"],
        ans: 0,
        exp: "«أخاك» اسم إنّ منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة."
      },
      {
        cat: "ألغاز نحوية",
        q: "«لا تنهَ عن خُلقٍ وتأتيَ مِثْلَهُ».. الواو هنا هي واو:",
        options: ["العطف", "الحال", "المعية", "القسم"],
        ans: 2,
        exp: "هي واو المعية؛ لذا نُصب الفعل المضارع (تأتيَ) بعدها بأن مضمرة."
      },
      {
        cat: "تراكيب لغوية",
        q: "الجمع الصحيح لكلمة «فَم» هو:",
        options: ["أفمام", "فموم", "أفواه", "فيَم"],
        ans: 2,
        exp: "أصل كلمة فم هو (فوه)، لذلك تُرد إلى أصلها عند الجمع فتصبح «أفواه»."
      },
      {
        cat: "فنون وبلاغة",
        q: "الجملة التي تشتمل على أسلوب تعجب قياسي هي:",
        options: ["سبحان الله!", "ما أجملَ الصدقَ!", "يا لروعة البحر!", "كيف فعلت هذا؟"],
        ans: 1,
        exp: "صيغة (ما أفعَلَ) مثل «ما أجملَ» هي إحدى صيغ التعجب القياسية."
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let timeLeft = 15;
    let timerInterval = null;
    const maxTime = 15;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      currentIdx = 0;
      score = 0;
      showScreen('quizScreen');
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      timeLeft = maxTime;
      updateTimerUI();

      const q = questions[currentIdx];
      document.getElementById('qIndex').innerText = currentIdx + 1;
      document.getElementById('scoreText').innerText = score;
      document.getElementById('qCat').innerText = q.cat;
      document.getElementById('qTitle').innerText = q.q;
      document.getElementById('explainBox').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';

      const optBox = document.getElementById('optionsContainer');
      optBox.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerHTML = `<span>${opt}</span>`;
        btn.onclick = () => selectAnswer(i);
        optBox.appendChild(btn);
      });

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timeOut();
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById('timerText').innerText = timeLeft;
      const pct = (timeLeft / maxTime) * 100;
      document.getElementById('timerBar').style.width = pct + '%';
    }

    function selectAnswer(selected) {
      clearInterval(timerInterval);
      const q = questions[currentIdx];
      const buttons = document.querySelectorAll('.btn-opt');
      buttons.forEach(b => b.disabled = true);

      const expBox = document.getElementById('explainBox');
      expBox.style.display = 'block';

      if (selected === q.ans) {
        buttons[selected].classList.add('correct');
        playCorrect();
        const earned = 100 + (timeLeft * 10);
        score += earned;
        document.getElementById('scoreText').innerText = score;
        expBox.innerHTML = `✨ <b>إجابة خارقة!</b> (+${earned} نقطة)<br>${q.exp}`;
      } else {
        if (selected !== -1) buttons[selected].classList.add('wrong');
        buttons[q.ans].classList.add('correct');
        playWrong();
        expBox.innerHTML = `❌ <b>أوبس!</b><br>${q.exp}`;
      }

      document.getElementById('nextBtn').style.display = 'block';
    }

    function timeOut() {
      selectAnswer(-1);
      document.getElementById('explainBox').innerHTML = `⏰ <b>انتهى الوقت!</b><br>${questions[currentIdx].exp}`;
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        loadQuestion();
      } else {
        endQuiz();
      }
    }

    function endQuiz() {
      showScreen('endScreen');
      document.getElementById('finalScore').innerText = score;
      let msg = "";
      if (score > 900) msg = "👑 مستواك: سيبويه زمانك! لغتك العربية لا يُعلى عليها.";
      else if (score > 500) msg = "⚡ مستواك: متمكن جداً ولديك حس لغوي قوي!";
      else msg = "📚 مستواك: بداية جيدة، تحتاج إلى القليل من المراجعة وتصبح أسطورة!";
      document.getElementById('endMessage').innerText = msg;
    }

    function restartQuiz() {
      startQuiz();
    }
  </script>
</body>
</html>
